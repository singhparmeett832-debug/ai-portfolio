<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f0e8" />
  <meta name="google-site-verification" content="YbG9OVQOe4ghHcTZ-4tmxVH6iFHzbjNPOVVWzuGV1nc" />
  <title>Parmeet Singh — Graphic Designer & AI Content Creator</title>

  <meta
    name="description"
    content="The creative portfolio of Parmeet Singh — Graphic Designer and AI Content Creator crafting bold visuals, digital campaigns, and AI-powered experiences."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --cream: #f5f0e8;
      --paper: #fffdf8;
      --ink: #171717;
      --muted: #6d6a64;
      --blue: #465cff;
      --orange: #ff6338;
      --purple: #b59cff;
      --lime: #d7f36b;
      --border: rgba(23, 23, 23, 0.14);
      --radius: 24px;
      --font-heading: "Space Grotesk", sans-serif;
      --font-body: "DM Sans", sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: var(--font-body);
      overflow-x: hidden;
      cursor: none;
    }

    body.menu-open {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    ::selection {
      background: var(--blue);
      color: white;
    }

    /* CUSTOM CURSOR */

    .cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 13px;
      height: 13px;
      background: var(--blue);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition:
        width 0.2s ease,
        height 0.2s ease,
        background 0.2s ease;
    }

    .cursor.hovering {
      width: 42px;
      height: 42px;
      background: var(--orange);
      mix-blend-mode: multiply;
    }

    /* PAGE PROGRESS */

    .progress-bar {
      position: fixed;
      z-index: 1001;
      top: 0;
      left: 0;
      width: 0;
      height: 4px;
      background: var(--blue);
    }

    /* NAVIGATION */

    .nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 18px 5.5%;
      background: rgba(245, 240, 232, 0.9);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      max-width: 1500px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-family: var(--font-heading);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.8px;
    }

    .brand-mark {
      width: 37px;
      height: 37px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--blue);
      border-radius: 12px;
      font-size: 16px;
      transform: rotate(-5deg);
      transition: transform 0.3s ease;
    }

    .brand:hover .brand-mark {
      transform: rotate(8deg);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .nav-links a {
      font-size: 13px;
      font-weight: 600;
      position: relative;
    }

    .nav-links a:not(.nav-cta)::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 0;
      height: 2px;
      background: var(--blue);
      transition: width 0.25s ease;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-cta {
      padding: 12px 19px;
      border-radius: 100px;
      color: white;
      background: var(--ink);
      transition: background 0.25s ease, transform 0.25s ease;
    }

    .nav-cta:hover {
      background: var(--blue);
      transform: translateY(-2px);
    }

    .menu-toggle {
      display: none;
      border: 0;
      background: transparent;
      font-size: 27px;
      cursor: pointer;
    }

    /* GENERAL */

    .container {
      width: min(1380px, 89%);
      margin-inline: auto;
    }

    .section {
      padding: 115px 0;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .eyebrow-dot {
      width: 8px;
      height: 8px;
      background: var(--orange);
      border-radius: 50%;
    }

    .section-heading {
      font-family: var(--font-heading);
      font-size: clamp(38px, 6vw, 76px);
      line-height: 0.98;
      letter-spacing: -4px;
      font-weight: 600;
    }

    .section-heading .highlight {
      color: var(--blue);
    }

    .section-top {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 35px;
      margin-bottom: 50px;
    }

    .section-description {
      max-width: 350px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    /* HERO */

    .hero {
      min-height: 730px;
      padding: 90px 0 80px;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .hero-inner {
      width: min(1380px, 89%);
      margin: auto;
      position: relative;
      z-index: 2;
    }

    .hero-topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 36px;
    }

    .availability {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 12px;
      font-weight: 600;
      color: #4c4b44;
    }

    .availability-dot {
      width: 9px;
      height: 9px;
      background: #72b94a;
      border-radius: 50%;
      box-shadow: 0 0 0 5px rgba(114, 185, 74, 0.12);
      animation: pulse 2s infinite;
    }

    .hero-location {
      font-size: 12px;
      color: var(--muted);
    }

    .hero-title {
      font-family: var(--font-heading);
      font-size: clamp(60px, 10.8vw, 156px);
      line-height: 0.86;
      letter-spacing: -0.09em;
      font-weight: 600;
      position: relative;
      z-index: 2;
    }

    .hero-title .line {
      display: block;
      overflow: hidden;
      padding-bottom: 0.08em;
    }

    .hero-title .line span {
      display: inline-block;
      animation: reveal-up 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .hero-title .line:nth-child(2) span {
      animation-delay: 0.12s;
    }

    .hero-title .blue-text {
      color: var(--blue);
    }

    .hero-title .outline-text {
      color: transparent;
      -webkit-text-stroke: 1.5px var(--ink);
    }

    .hero-star {
      display: inline-block;
      color: var(--orange);
      font-size: 0.5em;
      vertical-align: top;
      margin-left: 10px;
      animation: rotate-star 14s linear infinite;
      -webkit-text-stroke: 0;
    }

    .hero-bottom {
      margin-top: 50px;
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 35px;
    }

    .hero-copy {
      max-width: 435px;
      font-size: 16px;
      line-height: 1.85;
      color: #57544e;
    }

    .hero-copy strong {
      color: var(--ink);
    }

    .hero-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 53px;
      padding: 0 24px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid var(--ink);
      transition:
        transform 0.25s ease,
        background 0.25s ease,
        color 0.25s ease;
    }

    .button:hover {
      transform: translateY(-4px);
    }

    .button-primary {
      color: white;
      background: var(--ink);
    }

    .button-primary:hover {
      background: var(--blue);
      border-color: var(--blue);
    }

    .button-secondary:hover {
      color: white;
      background: var(--ink);
    }

    .hero-decoration {
      position: absolute;
      right: 9%;
      top: 23%;
      width: 135px;
      height: 135px;
      border-radius: 50%;
      background: var(--purple);
      z-index: 1;
      opacity: 0.75;
      animation: float 6s ease-in-out infinite;
    }

    .hero-decoration::before {
      content: "CREATIVE ENERGY";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      transform: rotate(-15deg);
    }

    .hero-decoration-two {
      position: absolute;
      right: 6%;
      bottom: 12%;
      width: 72px;
      height: 72px;
      background: var(--lime);
      border-radius: 50% 50% 50% 8%;
      transform: rotate(-25deg);
      animation: float 5s ease-in-out infinite reverse;
    }

    .hero-scroll {
      position: absolute;
      left: 5.5%;
      bottom: 34px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .scroll-line {
      width: 35px;
      height: 1px;
      background: var(--ink);
    }

    /* MARQUEE */

    .marquee {
      background: var(--blue);
      color: white;
      padding: 20px 0;
      overflow: hidden;
      transform: rotate(-1.2deg) scale(1.02);
      margin: 0 0 30px;
    }

    .marquee-track {
      display: flex;
      width: max-content;
      animation: marquee 28s linear infinite;
    }

    .marquee-item {
      display: flex;
      align-items: center;
      gap: 25px;
      padding-right: 25px;
      font-family: var(--font-heading);
      font-size: clamp(20px, 3vw, 34px);
      font-weight: 600;
      letter-spacing: -1px;
      white-space: nowrap;
    }

    .marquee-item span {
      color: var(--lime);
      font-size: 1.2em;
    }

    /* PROJECTS */

    .work {
      padding-top: 135px;
    }

    .project-grid {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 65px 30px;
      align-items: start;
    }

    .project-card {
      min-width: 0;
    }

    .project-card:nth-child(even) {
      margin-top: 100px;
    }

    .project-visual {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      aspect-ratio: 1.15 / 1;
      background: #e2dcd2;
      isolation: isolate;
    }

    .project-card:nth-child(2) .project-visual {
      aspect-ratio: 0.95 / 1;
    }

    .project-card:nth-child(3) .project-visual {
      aspect-ratio: 1 / 0.92;
    }

    .project-card:nth-child(4) .project-visual {
      aspect-ratio: 1.1 / 1;
    }

    .project-visual img {
      height: 100%;
      transition: transform 0.7s cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    .project-card:hover .project-visual img {
      transform: scale(1.06);
    }

    .project-visual .project-label {
      position: absolute;
      left: 18px;
      top: 18px;
      z-index: 2;
      padding: 9px 13px;
      background: rgba(255, 253, 248, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 100px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .project-arrow {
      position: absolute;
      right: 18px;
      bottom: 18px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: white;
      display: grid;
      place-items: center;
      font-size: 22px;
      transform: translateY(12px);
      opacity: 0;
      transition: 0.3s ease;
      z-index: 3;
    }

    .project-card:hover .project-arrow {
      transform: translateY(0);
      opacity: 1;
    }

    .project-meta {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 15px;
      padding-top: 20px;
    }

    .project-title {
      font-family: var(--font-heading);
      font-size: clamp(22px, 3vw, 32px);
      line-height: 1.1;
      letter-spacing: -1.2px;
      font-weight: 600;
    }

    .project-type {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .project-number {
      font-family: var(--font-heading);
      font-size: 14px;
      color: var(--muted);
    }

    .work-footer {
      text-align: center;
      margin-top: 75px;
    }
